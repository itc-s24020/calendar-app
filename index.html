<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カレンダー</title>
<link rel="stylesheet" href="app/css/style.css">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
<div class="wrap">

  <!-- ヘッダー: 年月表示と月移動ボタン -->
  <div class="header">
    <div class="titleblock">
      <span class="year" id="yearLabel"></span>
      <div class="month" id="monthLabel"></div>
    </div>
    <div class="nav">
      <button id="prevBtn">← 前月</button>
      <button id="todayBtn" class="today-btn">今月</button>
      <button id="nextBtn">次月 →</button>
    </div>
  </div>

  <!-- 曜日行 -->
  <div class="weekdays">
    <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
  </div>

  <!-- 日付グリッド本体 -->
  <div class="grid" id="grid"></div>

  <!-- 今日の見せ方と表示範囲の注記 -->
  <div class="footnote">
    <div><span class="seal">今</span>今日の日付は朱印で表示</div>
    <div id="rangeNote"></div>
  </div>

</div>

<!-- 予定追加・編集用モーダル -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>予定を入力</h3>
    <div class="modal-date" id="modalDate"></div>
    <ul id="scheduleList"></ul>
    <!-- 予定の追加フォーム -->
    <form id="addForm">
      <div class="form-row">
        <input type="time" id="scheduleTimeInput" class="time-input" aria-label="予定の時刻">
        <input type="text" id="scheduleInput" placeholder="予定を入力…" maxlength="60" autocomplete="off">
        <button type="submit" class="add">追加</button>
      </div>
      <textarea id="scheduleMemoInput" class="memo-input" placeholder="メモを入力…" maxlength="300" rows="3"></textarea>
    </form>
    <!-- 既存予定の編集フォーム -->
    <div class="edit-panel" id="editPanel" hidden>
      <div class="edit-panel-title">予定を編集</div>
      <form id="editForm">
        <div class="form-row">
          <input type="time" id="editTimeInput" class="time-input" aria-label="編集する予定の時刻">
          <input type="text" id="editInput" maxlength="60" autocomplete="off">
          <button type="submit" class="add">保存</button>
        </div>
        <textarea id="editMemoInput" class="memo-input" placeholder="メモを入力…" maxlength="300" rows="3"></textarea>
      </form>
      <div class="close-row edit-actions">
        <button type="button" id="cancelEdit">キャンセル</button>
      </div>
    </div>
    <!-- モーダルを閉じる -->
    <div class="close-row"><button id="closeModal">閉じる</button></div>
  </div>
</div>

<!-- 設定ファイルを先に読み込み、アプリ本体がそれを参照できるようにする -->
<script src="app/config.js"></script>
<!-- カレンダー本体の処理 -->
<script src="app/js/app.js"></script>
</body>
</html>
